<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI RAG Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #005a9e;
        }

        #loading {
            display: none;
            margin-top: 20px;
            text-align: center;
            color: #666;
        }

        .answer {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .sources {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #ffe5e5;
            color: #b00020;
            border-radius: 8px;
        }
    </style>
</head>


<body>

<div class="container">

    <h1>🤖 AI RAG Assistant</h1>

    <p class="description">
        Ask questions based on the five provided documents.
    </p>


    <textarea
        id="question"
        placeholder="Enter your question here..."
    ></textarea>


    <button onclick="askQuestion()">
        Ask Question
    </button>


    <div id="loading">
        Searching documents and generating answer...
    </div>


    <div id="result"></div>

</div>


<script>

async function askQuestion() {

    const question =
        document.getElementById("question").value.trim();

    const result =
        document.getElementById("result");

    const loading =
        document.getElementById("loading");


    // Check empty question

    if (!question) {

        result.innerHTML = `
            <div class="error">
                Please enter a question.
            </div>
        `;

        return;
    }


    // Show loading

    loading.style.display = "block";

    result.innerHTML = "";


    try {

        const response = await fetch("/ask", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Something went wrong."
            );

        }


        // Display answer

        let html = `

            <div class="answer">

                <h2>Final Answer</h2>

                <p>${escapeHtml(data.answer)}</p>

            </div>

        `;


        // Display sources

        if (
            data.sources &&
            data.sources.length > 0
        ) {

            html += `

                <div class="sources">

                    <h2>Sources</h2>

                    <ul>
            `;


            data.sources.forEach(source => {

                html += `

                    <li>
                        ${escapeHtml(
                            String(source.source)
                        )}

                        | Page:

                        ${escapeHtml(
                            String(source.page)
                        )}
                    </li>

                `;

            });


            html += `

                    </ul>

                </div>

            `;

        }


        result.innerHTML = html;


    } catch (error) {

        result.innerHTML = `

            <div class="error">

                Error: ${escapeHtml(error.message)}

            </div>

        `;

    } finally {

        loading.style.display = "none";

    }

}


// Prevent HTML injection

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>

</html>
